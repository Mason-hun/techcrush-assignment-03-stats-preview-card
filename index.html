<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Young+Serif&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lexend+Deca:wght@100..900&family=Outfit:wght@100..900&family=Young+Serif&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <title>Business Analytics Marketing Card</title>
</head>
<body>
   <main>
    <article class="card">
        <div class="content">
            <h1>Get <span class="insights">insights</span> that help your business grow.</h1>
            <p>Discover the benefits of data analytics and make better decisions regarding revenue, customer experience, and overall efficiency.</p>
            <div class="stats">
                <div class="stat">
                    <span class="stat-number">10k+</span>
                    <span class="stat-label">companies</span>
                </div>

                <div class="stat">
                    <span class="stat-number">314</span>
                    <span class="stat-label">templates</span>
                </div>

                <div class="stat">
                    <span class="stat-number">12M+</span>
                    <span class="stat-label">queries</span>
                </div>
            </div>
        </div>

        <picture class="hero-img">
            <source media="(max-width: 600px)" srcset="images/image-header-mobile.jpg">
            <img src="images/image-header-desktop.jpg" alt="People working together around a table in an office.">
        </picture>
    </article>
   </main> 
</body>
</html>
